# Optional real-inference lab. The default acceptance stack remains deterministic.
services:
  ollama:
    image: ollama/ollama:0.6.8
    environment:
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes: [live-models:/root/.ollama]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 60
  gomodel:
    environment:
      OLLAMA_QAI_BASE_URL: http://ollama:11434/v1
      OLLAMA_EXT_BASE_URL: http://ollama:11434/v1
    depends_on:
      ollama: {condition: service_healthy}
  live-lab:
    build:
      context: .
      dockerfile: demo/Dockerfile.live
    image: gomodel-exporter:live
    command: [uvicorn, demo.live_app:app, --host, 0.0.0.0, --port, "8090"]
    ports: ["127.0.0.1:8090:8090"]
    environment:
      EXPORTER_GOMODEL_DB_URL: postgresql://exporter_ro:${READONLY_PASSWORD:?}@gomodel-db:5432/gomodel
      EXPORTER_STATE_DB_URL: postgresql://postgres:${EXPORTER_PASSWORD:?}@exporter-db:5432/exporter
      EXPORTER_LAGO_API_URL: http://lago-api:3000
      EXPORTER_LAGO_API_KEY: ${LAGO_ORG_API_KEY:?}
      EXPORTER_BILLABLE_PROVIDERS: ollama-qai
      EXPORTER_POLL_INTERVAL_SECONDS: "2"
      EXPORTER_MAX_RETRIES: "2"
      EXPORTER_RECONCILIATION_DELAY_SECONDS: "2"
      GOMODEL_URL: http://gomodel:8080
      GOMODEL_MASTER_KEY: ${GOMODEL_MASTER_KEY:?}
      LIVE_MODEL: llama3.2:1b
      LIVE_OLLAMA_URL: http://ollama:11434
      LIVE_DATA_DIR: /home/exporter/live-data
    volumes: [live-history:/home/exporter/live-data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/ping')"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  live-models:
  live-history:
