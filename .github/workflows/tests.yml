name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_PASSWORD: exporter
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      EXPORTER_TEST_ADMIN_DB_URL: postgresql://postgres:exporter@localhost:5434/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e '.[dev]'
      - name: Verify original handover baseline on PostgreSQL
        run: |
          mkdir /tmp/exporter-baseline
          git archive 3452566 | tar -x -C /tmp/exporter-baseline
          cd /tmp/exporter-baseline
          python -m pytest -q --junitxml=/tmp/baseline.xml
          python -c "import xml.etree.ElementTree as E; r=E.parse('/tmp/baseline.xml'); assert all(int(s.get('skipped',0)) == 0 for s in r.iter('testsuite'))"
      - name: Full test gate (no skips allowed)
        run: python -m pytest -q --require-db --junitxml=test-results.xml
      - name: Package and dependency checks
        run: |
          python -m pip check
          python -m build --no-isolation
          python -m compileall -q exporter scripts demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
